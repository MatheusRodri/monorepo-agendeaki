<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirme seu cadastro</title>
  </head>
  <body style="margin:0; padding:0; background:#f7f2f5; color:#2d1e2f; font-family:Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f7f2f5; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px; background:#ffffff; border-radius:16px; overflow:hidden;">
            <tr>
              <td style="background:#321f35; padding:28px 32px;">
                <p style="margin:0; color:#ffffff; font-size:24px; font-weight:700; letter-spacing:-.5px;">agende<span style="color:#ef9c8d;">aki</span></p>
              </td>
            </tr>
            <tr>
              <td style="padding:36px 32px 20px;">
                <p style="margin:0 0 12px; color:#b65754; font-size:12px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase;">Quase lá</p>
                <h1 style="margin:0 0 16px; color:#321f35; font-size:28px; line-height:1.2;">Confirme seu e-mail</h1>
                <p style="margin:0; color:#5c4a5f; font-size:16px; line-height:1.6;">Obrigado por criar sua conta no AgendeAki. Clique no botão abaixo para confirmar seu e-mail e concluir o cadastro.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:12px 32px 32px;">
                <a href="{{ .ConfirmationURL }}" style="background:#b65754; border-radius:8px; color:#ffffff; display:inline-block; font-size:16px; font-weight:700; padding:14px 22px; text-decoration:none;">Confirmar meu e-mail</a>
              </td>
            </tr>
            <tr>
              <td style="border-top:1px solid #eadfe7; padding:22px 32px 30px;">
                <p style="margin:0; color:#7d6b7f; font-size:13px; line-height:1.5;">Se você não criou esta conta, pode ignorar este e-mail com segurança.</p>
              </td>
            </tr>
          </table>
          <p style="margin:20px 0 0; color:#8b798d; font-size:12px;">AgendeAki · Seu tempo, do seu jeito.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
